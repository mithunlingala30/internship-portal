name: lms_internship
description: Mevonics LMS Portal - A Learning Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3
  file_picker: ^11.0.2
  intl: ^0.20.2
  url_launcher: ^6.2.5
  image_picker: ^1.2.1
  flutter_local_notifications: ^21.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "master_4k.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "master_4k.png"
  macos:
    generate: true
    image_path: "master_4k.png"
  linux:
    generate: true
    image_path: "master_4k.png"
  image_path: "master_4k.png"
  min_sdk_android: 21
  remove_alpha_ios: true 

flutter:
  uses-material-design: true
  assets:
    - master_4k.png
    - assets/
